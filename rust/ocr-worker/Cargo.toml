[package]
name = "starchat-ocr"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "StarChat OCR worker: WGC capture, PP-OCRv6 ONNX inference, layout tracking, motion following"

[[bin]]
name = "starchat-ocr"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
windows-capture = "2.0.1"
serde_json = "1"
regex = "1"
yaml-rust2 = "0.10"
